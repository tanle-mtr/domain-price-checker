name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - name: Extract static pages
        run: |
          mkdir -p out
          cp out/index.html out/404.html 2>/dev/null || true
          for page in game-prices cheap whois id ip login callback docs admin console; do
            src=".next/server/app/${page}/page"
            if [ -f "${src}.js" ]; then
              mkdir -p "out/${page}"
              cp "${src}.html" "out/${page}/index.html" 2>/dev/null || true
              cp "${src}.js" "out/${page}/page.js" 2>/dev/null || true
            fi
          done
          # Copy _next/static assets
          if [ -d ".next/static" ]; then
            cp -r ".next/static" "out/_next/"
          fi
          ls -laR out/ | head -50
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
