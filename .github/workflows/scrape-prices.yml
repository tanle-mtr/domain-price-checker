name: Price Scraper

on:
  schedule:
    # 每6小时运行一次
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      tld:
        description: 'TLD to scrape (e.g., com, cn, xyz)'
        required: false
        default: 'com'
      force:
        description: 'Force re-scan all domains'
        required: false
        default: 'false'
      sample_size:
        description: 'Number of sample domains to check'
        required: false
        default: '100'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install axios cheerio node-whois
        
      - name: Run price scraper with WHOIS check
        run: node scripts/scrape-prices.mjs
        env:
          TLD: ${{ github.event.inputs.tld || 'com' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          SAMPLE_SIZE: ${{ github.event.inputs.sample_size || '100' }}
          
      - name: Check and commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/prices/
          git add data/stats.json
          git diff --cached --quiet || git commit -m "Update price data [skip ci]"
          git push
